<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F6E8A"/>
      <stop offset="100%" style="stop-color:#48B5C5"/>
    </linearGradient>
  </defs>
  
  <!-- Square rounded background -->
  <rect width="100" height="100" rx="20" fill="url(#grad)"/>
  
  <!-- Letter "S" made with pill shapes -->
  <g transform="translate(50, 52)">
    <!-- Top pill (S curve top) -->
    <rect x="-10" y="-22" width="20" height="14" rx="7" fill="white" transform="rotate(20, 0, -15)"/>
    
    <!-- Middle pill -->
    <rect x="-12" y="-7" width="24" height="14" rx="7" fill="white"/>
    
    <!-- Bottom pill (S curve bottom) -->
    <rect x="-10" y="8" width="20" height="14" rx="7" fill="white" transform="rotate(-20, 0, 15)"/>
    
    <!-- Small cross decoration -->
    <g transform="translate(0, 0)">
      <rect x="-4" y="-1" width="8" height="2" rx="1" fill="url(#grad)"/>
      <rect x="-1" y="-4" width="2" height="8" rx="1" fill="url(#grad)"/>
    </g>
  </g>
</svg>